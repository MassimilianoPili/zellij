# Fork-only helper: builds the Windows release binary of this branch and publishes it as a run
# artifact (no release, no write permission needed). Not meant for upstream.
name: Windows binary

on:
  push:
    branches: [ci/windows-binary]

jobs:
  build:
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: "x86_64-pc-windows-msvc,wasm32-wasip1"
          cache: false
          rustflags: ""

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Build release binary (no-web)
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo xtask ci build-release --no-web

      - name: Upload zellij.exe
        uses: actions/upload-artifact@v4
        with:
          name: zellij-no-web-x86_64-pc-windows-msvc
          path: target/release/zellij.exe
          if-no-files-found: error
